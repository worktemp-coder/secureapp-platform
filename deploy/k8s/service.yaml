apiVersion: v1
kind: Service
metadata:
  name: secureapp
  namespace: secureapp
  labels:
    app.kubernetes.io/name: secureapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: secureapp
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
