apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secureapp-deployer
  namespace: secureapp
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secureapp-deployer
  namespace: secureapp
subjects:
  - kind: ServiceAccount
    name: secureapp-deployer
    namespace: secureapp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secureapp-deployer
